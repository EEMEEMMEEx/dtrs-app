# รันแยก Frontend + Backend สำหรับทดสอบ / ตรวจสอบ (พอร์ต: 8404 = Next, 8405 = Nest)
# ตัวอย่าง: set NEXT_PUBLIC_API_BASE_URL แล้ว build
#   set NEXT_PUBLIC_API_BASE_URL=http://localhost:8405/api
#   docker compose build --build-arg NEXT_PUBLIC_API_BASE_URL=%NEXT_PUBLIC_API_BASE_URL%
# หรือใช้ไฟล์ .env ข้าง compose (ดู README)
#   docker compose --env-file .env.docker up -d --build
#
# หมายเหตุ: ค่า DATABASE_URL / JWT / MinIO ฯลฯ ต้องส่งเข้า backend ผ่าน environment
# (เช่น export ก่อนรัน หรือสร้าง docker-compose.override.yml ในเครื่อง — ไม่ขึ้น git)
#
# stResource limits (CPU/RAM):
# - จำกัดไม่ให้ container กิน CPU/RAM จน ho ค้าง (เช่น กรณีมัลแวร์ / process รันaway)
# - Docker Compose เวอร์ชันใหม่มัก honor `deploy.resources` ตอน `docker compose up`
#   ถ้าเครื่องคุณไม่ enforce จริง ให้ตรวจด้วย `docker stats` หรือใช้ Swarm (`docker stack deploy`)
#   / ปรับใน `docker-compose.override.yml`
#
# Volumes:
# - ไฟล์นี้ไม่ mount โฟลเดอร์จาก host เข้า frontend/backend (ลดความเสี่ยงแพร่จาก host)

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dtrs-app-backend
    restart: unless-stopped
    tmpfs:
      - /tmp:rw,noexec,nosuid
    ports:
      - "8405:4100"
    environment:
      NODE_ENV: production
      PORT: "4100"
    # ไม่มี volumes: — ไม่ผูก path บน host
    deploy:
      resources:
        limits:
          # Nest + Chromium (PDF) ต้องการ RAM มากกว่า frontend อย่างน้อยเล็กน้อย
          cpus: "1.50"
          memory: 1536M
        reservations:
          cpus: "0.25"
          memory: 256M
    # จำกัดจำนวน process (ลดความเสียหายถ้ามี fork bomb / process spawn ผิดปกติ)
    pids_limit: 512

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8405/api}
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
        SENTRY_DSN: ${SENTRY_DSN:-}
        NEXT_PUBLIC_APP_ENV: ${NEXT_PUBLIC_APP_ENV:-}
        NEXT_PUBLIC_APP_RELEASE: ${NEXT_PUBLIC_APP_RELEASE:-}
        SENTRY_URL: ${SENTRY_URL:-http://192.168.0.115:8700}
        NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE: ${NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE:-}
    container_name: dtrs-app-frontend
    restart: unless-stopped
    # ลดความเสี่ยงรัน binary จาก /tmp (ให้ใช้คู่กับ deploy ผ่าน NPM + ปิดพอร์ต 8404 ที่ firewall)
    tmpfs:
      - /tmp:rw,noexec,nosuid
    ports:
      - "8404:3000"
    environment:
      NODE_ENV: production
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:8404}
      # service name ใน compose = `backend` (คนละแบบกับ CI ที่ใช้ชื่อ container `dtrs-app-backend`)
      API_INTERNAL_BASE_URL: ${API_INTERNAL_BASE_URL:-http://backend:4100/api}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_URL: ${SENTRY_URL:-http://192.168.0.115:8700}
    depends_on:
      - backend
    # ไม่มี volumes: — ไม่ผูก path บน host
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          cpus: "0.10"
          memory: 128M
    pids_limit: 256
