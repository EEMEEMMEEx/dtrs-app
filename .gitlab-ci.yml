# GitLab CI/CD — dtrs-app
# UAT: branch staging → http://192.168.0.115:8404 (manual deploy)
# PRD: branch main/master → https://dtrs-app.forth.co.th (manual deploy)
#
# GitLab CI/CD Variables (ใช้ environment scope staging / production ตาม job):
#   SSH_PRIVATE_KEY, DATABASE_URL, JWT_SECRET, NEXTAUTH_SECRET, NEXTAUTH_URL,
#   NEXT_PUBLIC_API_BASE_URL (build-arg frontend image), FRONTEND_BASE_URL,
#   ALLOWED_ORIGINS, MINIO_*, SMTP_TLS_REJECT_UNAUTHORIZED, CRON_SECRET
#   Deploy host/path (บังคับใน GitLab UI — ไม่ hardcode ในไฟล์นี้):
#     DOCKER_HOST_BUILD, DOCKER_HOST_UAT / DOCKER_HOST_PRD,
#     DEPLOY_SERVER_UAT / DEPLOY_SERVER_PRD, DEPLOY_PATH_UAT / DEPLOY_PATH_PRD
#   Registry (กลุ่ม E): REGISTRY_URL บังคับ; REGISTRY_USER / REGISTRY_PASSWORD optional
#   API_INTERNAL_BASE_URL — default ในไฟล์นี้ (NextAuth server-side → backend บน Docker network)
#   GlitchTip (optional): NEXT_PUBLIC_SENTRY_DSN (bake ตอน build:frontend), SENTRY_DSN + SENTRY_URL (runtime frontend)
#   NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE — bake ตอน build:frontend (optional override; ว่างใช้ fallback ตาม NEXT_PUBLIC_APP_ENV)
#   NEXT_PUBLIC_APP_ENV — default ตาม branch (staging/production) ใน .rules_ci_branches_with_env
#
# อ้างอิง: docs/GitLab-CI-Plan.md, docs/GitLab-CI-Variables-Checklist.md

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'

stages:
  - test
  - build
  - deploy
  - deploy_docker
  - cleanup

variables:
  NODE_VERSION: "22.23.4"
  # UAT docker run: ชื่อ container บน dtrs-app-net · PRD compose: ใช้ได้ทั้ง `backend` และ alias `dtrs-app-backend`
  API_INTERNAL_BASE_URL: "http://dtrs-app-backend:4100/api"

  # DOCKER_HOST_* / DEPLOY_SERVER_* / DEPLOY_PATH_* — ตั้งใน GitLab CI/CD Variables เท่านั้น
  # (ดู docs/GitLab-CI-Variables-Checklist.md กลุ่ม D)

  APP_IMAGE_BACKEND: "dtrs-app-backend"
  APP_IMAGE_FRONTEND: "dtrs-app-frontend"
  IMAGE_TAG: "$CI_COMMIT_SHORT_SHA"

  FRONTEND_HOST_PORT: "8404"
  BACKEND_HOST_PORT: "8405"

  # Resource limits — sync กับ docker-compose.yml
  BACKEND_CPUS: "1.50"
  BACKEND_MEMORY: "1536m"
  BACKEND_PIDS_LIMIT: "512"
  FRONTEND_CPUS: "0.50"
  FRONTEND_MEMORY: "512m"
  FRONTEND_PIDS_LIMIT: "256"

  CLEANUP_KEEP_IMAGES: "2"

  # TC-CI-02 image size gate (MB) — ปรับได้เมื่อ optimize image ต่อ
  FRONTEND_IMAGE_MAX_MB: "500"
  BACKEND_IMAGE_MAX_MB: "1126"

# --- Reusable templates ---

.runner_docker:
  tags:
    - docker
    - forth

.ssh_setup:
  before_script:
    - apk add --no-cache openssh-client bash
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - |
      if [ -z "$SSH_PRIVATE_KEY" ]; then
        echo "ERROR: SSH_PRIVATE_KEY is not set (check GitLab CI/CD Variables + environment scope)"
        exit 1
      fi
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_ci
    - chmod 600 ~/.ssh/id_ci
    - |
      printf '%s\n' \
        'Host *' \
        '  IdentityFile ~/.ssh/id_ci' \
        '  IdentitiesOnly yes' \
        > ~/.ssh/config
      chmod 600 ~/.ssh/config
    - ssh-keyscan -H "${DEPLOY_SERVER#*@}" >> ~/.ssh/known_hosts 2>/dev/null || true

.validate_deploy_env:
  before_script:
    - |
      missing=""
      [ -z "$DATABASE_URL" ] && missing="$missing DATABASE_URL"
      [ -z "$JWT_SECRET" ] && missing="$missing JWT_SECRET"
      [ -z "$NEXTAUTH_SECRET" ] && missing="$missing NEXTAUTH_SECRET"
      [ -z "$NEXTAUTH_URL" ] && missing="$missing NEXTAUTH_URL"
      [ -z "$FRONTEND_BASE_URL" ] && missing="$missing FRONTEND_BASE_URL"
      [ -z "$ALLOWED_ORIGINS" ] && missing="$missing ALLOWED_ORIGINS"
      if [ -n "$missing" ]; then
        echo "ERROR: Missing required GitLab CI/CD Variables (check environment scope):$missing"
        echo "See docs/GitLab-CI-Variables-Checklist.md"
        exit 1
      fi

# ตรวจ host/path หลัง job map DEPLOY_SERVER / DEPLOY_PATH / DOCKER_HOST_REMOTE แล้ว
.validate_deploy_targets:
  before_script:
    - |
      missing=""
      [ -z "$DEPLOY_SERVER" ] && missing="$missing DEPLOY_SERVER(from DEPLOY_SERVER_UAT|PRD)"
      [ -z "$DEPLOY_PATH" ] && missing="$missing DEPLOY_PATH(from DEPLOY_PATH_UAT|PRD)"
      [ -z "$DOCKER_HOST_REMOTE" ] && missing="$missing DOCKER_HOST_REMOTE(from DOCKER_HOST_UAT|PRD)"
      if [ -n "$missing" ]; then
        echo "ERROR: Missing deploy target GitLab CI/CD Variables:$missing"
        echo "See docs/GitLab-CI-Variables-Checklist.md กลุ่ม D"
        exit 1
      fi

.validate_docker_host_build:
  before_script:
    - |
      if [ -z "$DOCKER_HOST_BUILD" ]; then
        echo "ERROR: DOCKER_HOST_BUILD is not set (GitLab CI/CD Variables — กลุ่ม D)"
        echo "See docs/GitLab-CI-Variables-Checklist.md"
        exit 1
      fi

.validate_registry:
  before_script:
    - |
      if [ -z "$REGISTRY_URL" ]; then
        echo "ERROR: REGISTRY_URL is not set (GitLab CI/CD Variables — กลุ่ม E)"
        echo "See docs/GitLab-CI-Variables-Checklist.md"
        exit 1
      fi

.deploy_ssh_and_validate:
  extends: .ssh_setup
  before_script:
    - !reference [.ssh_setup, before_script]
    - !reference [.validate_deploy_env, before_script]
    - !reference [.validate_deploy_targets, before_script]
    - !reference [.validate_registry, before_script]

# Rules for running test jobs: on Merge Requests, feature/bugfix branches, and deploy branches
.rules_ci_test:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

.rules_ci_branches:
  rules:
    - if: '$CI_COMMIT_BRANCH == "staging" || $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master"'

# map branch → GitLab Environment name (ให้ variables ที่ scope เป็น staging/production ถูก inject)
.rules_ci_branches_with_env:
  rules:
    - if: '$CI_COMMIT_BRANCH == "staging"'
      variables:
        DTRS_CI_ENV: staging
        NEXT_PUBLIC_APP_ENV: staging
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master"'
      variables:
        DTRS_CI_ENV: production
        NEXT_PUBLIC_APP_ENV: production

.rules_staging:
  rules:
    - if: '$CI_COMMIT_BRANCH == "staging"'

.rules_prd:
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master"'

.docker_build_ci_runner:
  image: docker:latest
  before_script:
    - !reference [.validate_docker_host_build, before_script]
    - !reference [.validate_registry, before_script]
  script:
    - |
      if [ -z "$NEXT_PUBLIC_API_BASE_URL" ]; then
        echo "ERROR: NEXT_PUBLIC_API_BASE_URL is empty (required build-arg, check CI/CD Variables + scope)"
        exit 1
      fi
    - export DOCKER_HOST="$DOCKER_HOST_BUILD"
    - sh scripts/docker-artifact-gate.sh .
    # .dockerignore ปกติตัด node_modules/dist/.next — ต้องเปิดก่อน COPY ใน ci-runner
    - sh scripts/docker-ci-allow-artifacts.sh .
    # Tags ต่อ env: แค่ {sha}-uat|prd + uat-latest|latest-prd (ไม่ติด latest-uat / prd-latest / :prd)
    - docker build --target ci-runner -t "$IMAGE_BACKEND" -f backend/Dockerfile ./backend
    - docker tag "$IMAGE_BACKEND" "$TAG_BACKEND_LATEST"
    - sh scripts/docker-image-size-gate.sh "$IMAGE_BACKEND" "$BACKEND_IMAGE_MAX_MB" "backend"
    - docker build --target ci-runner -t "$IMAGE_FRONTEND" -f frontend/Dockerfile ./frontend
    - docker tag "$IMAGE_FRONTEND" "$TAG_FRONTEND_LATEST"
    - sh scripts/docker-image-size-gate.sh "$IMAGE_FRONTEND" "$FRONTEND_IMAGE_MAX_MB" "frontend"
    - docker images "${APP_IMAGE_BACKEND}"
    - docker images "${APP_IMAGE_FRONTEND}"
    # Push to private registry (short tags stay on build host for local inspect)
    - . scripts/ci-registry.sh && registry_push_build_tags

.smoke_deployed:
  stage: deploy_docker
  extends:
    - .runner_docker
  image: alpine:latest
  script:
    - apk add --no-cache curl bash
    - export SMOKE_FRONTEND_URL="${SMOKE_FRONTEND_URL:-$FRONTEND_BASE_URL}"
    - |
      if [ -z "$SMOKE_FRONTEND_URL" ]; then
        echo "ERROR: SMOKE_FRONTEND_URL / FRONTEND_BASE_URL is empty"
        exit 1
      fi
    - sh scripts/docker-regression-smoke.sh

# --- TEST ---

test:frontend:
  stage: test
  extends:
    - .runner_docker
    - .rules_ci_test
  image: node:${NODE_VERSION}
  cache:
    key: ${CI_COMMIT_REF_SLUG}-frontend-test
    paths:
      - frontend/node_modules/
  script:
    - cd frontend
    - npm ci --prefer-offline --no-audit
    - npm run lint -- .
    - npm test

test:backend:
  stage: test
  extends:
    - .runner_docker
    - .rules_ci_test
  image: node:${NODE_VERSION}
  cache:
    key: ${CI_COMMIT_REF_SLUG}-backend-test
    paths:
      - backend/node_modules/
  script:
    - cd backend
    - npm ci --prefer-offline --no-audit
    - npx prisma generate
    # CI: lint แบบอ่านอย่างเดียว (ห้าม --fix) — script npm run lint มี --fix ติดมา
    - npx eslint "{src,apps,libs,test}/**/*.ts"
    - npm test

# --- BUILD ---

build:frontend:
  stage: build
  extends:
    - .runner_docker
    - .rules_ci_branches_with_env
  image: node:${NODE_VERSION}
  # action: prepare — อ่าน env-scoped vars โดยไม่สร้าง deployment record
  environment:
    name: $DTRS_CI_ENV
    action: prepare
  needs:
    - job: test:frontend
  cache:
    key: ${CI_COMMIT_REF_SLUG}-frontend
    paths:
      - frontend/node_modules/
  script:
    - |
      if [ -z "$NEXT_PUBLIC_API_BASE_URL" ]; then
        echo "ERROR: NEXT_PUBLIC_API_BASE_URL is empty (required at next build, check CI/CD Variables + scope ${DTRS_CI_ENV})"
        exit 1
      fi
      if [ -n "$NEXT_PUBLIC_SENTRY_DSN" ]; then
        echo "GlitchTip: NEXT_PUBLIC_SENTRY_DSN is set (env=${NEXT_PUBLIC_APP_ENV:-unset})"
      else
        echo "GlitchTip: NEXT_PUBLIC_SENTRY_DSN is empty — browser error tracking disabled for this build"
      fi
      if [ -n "$NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE" ]; then
        echo "GlitchTip: NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE=${NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE} (baked)"
      else
        echo "GlitchTip: NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE empty — code fallback by NEXT_PUBLIC_APP_ENV=${NEXT_PUBLIC_APP_ENV:-unset}"
      fi
    - cd frontend
    - npm ci --prefer-offline --no-audit
    - npm run build
  artifacts:
    # ci-runner COPY แค่ standalone + static + public — อย่าส่งทั้ง `.next`
    # (`.next/cache` webpack มัก >500MB → GitLab coordinator 413)
    paths:
      - frontend/.next/standalone
      - frontend/.next/static
      - frontend/public
    expire_in: 1 hour

build:backend:
  stage: build
  extends:
    - .runner_docker
    - .rules_ci_branches
  image: node:${NODE_VERSION}
  needs:
    - job: test:backend
  cache:
    key: ${CI_COMMIT_REF_SLUG}-backend
    paths:
      - backend/node_modules/
  script:
    - cd backend
    - npm ci --prefer-offline --no-audit
    - npx prisma generate
    - npm run build
    - npm prune --omit=dev
  artifacts:
    paths:
      - backend/dist
      - backend/node_modules
      - backend/package.json
      - backend/package-lock.json
      - backend/prisma
    expire_in: 1 hour

# --- DEPLOY (summary) ---

deploy:summary:
  stage: deploy
  extends:
    - .runner_docker
    - .rules_ci_branches
  image: alpine:latest
  needs:
    - job: build:frontend
    - job: build:backend
  script:
    - |
      if [ "$CI_COMMIT_BRANCH" = "staging" ]; then
        echo "UAT: docker_build:uat (build+push registry) → deploy:uat:docker (pull+retag → docker run) → smoke:uat:docker บน ${DEPLOY_SERVER_UAT}"
      else
        echo "PRD: docker_build:prd (build+push registry) → deploy:prd:docker (pull+retag → compose) → smoke:prd:docker บน ${DEPLOY_SERVER_PRD}"
      fi

# --- DOCKER BUILD: UAT ---

docker_build:uat:
  stage: deploy_docker
  extends:
    - .runner_docker
    - .rules_staging
    - .docker_build_ci_runner
  environment:
    name: staging
  needs:
    - job: build:frontend
    - job: build:backend
    - job: deploy:summary
  when: manual
  variables:
    IMAGE_BACKEND: "${APP_IMAGE_BACKEND}:${IMAGE_TAG}-uat"
    IMAGE_FRONTEND: "${APP_IMAGE_FRONTEND}:${IMAGE_TAG}-uat"
    TAG_BACKEND_LATEST: "${APP_IMAGE_BACKEND}:uat-latest"
    TAG_FRONTEND_LATEST: "${APP_IMAGE_FRONTEND}:uat-latest"

deploy:uat:docker:
  stage: deploy_docker
  extends:
    - .runner_docker
    - .deploy_ssh_and_validate
    - .rules_staging
  image: docker:latest
  variables:
    DEPLOY_SERVER: "$DEPLOY_SERVER_UAT"
    DEPLOY_PATH: "$DEPLOY_PATH_UAT"
    DOCKER_HOST_REMOTE: "$DOCKER_HOST_UAT"
    BACKEND_IMAGE: "${APP_IMAGE_BACKEND}:uat-latest"
    FRONTEND_IMAGE: "${APP_IMAGE_FRONTEND}:uat-latest"
  needs:
    - job: docker_build:uat
  when: manual
  environment:
    name: staging
    url: $FRONTEND_BASE_URL
  script:
    # Pull from registry onto UAT daemon, retag short names, then docker run via SSH
    - export DOCKER_HOST="$DOCKER_HOST_REMOTE"
    - . scripts/ci-registry.sh && registry_login && registry_pull_and_retag "$BACKEND_IMAGE" && registry_pull_and_retag "$FRONTEND_IMAGE"
    - |
      ssh "$DEPLOY_SERVER" "bash -s" << EOF
      set -e
      export DOCKER_HOST='${DOCKER_HOST_REMOTE}'
      mkdir -p '${DEPLOY_PATH}'
      cd '${DEPLOY_PATH}'
      docker network inspect dtrs-app-net >/dev/null 2>&1 || docker network create dtrs-app-net
      docker rm -f dtrs-app dtrs-app-backend dtrs-app-frontend 2>/dev/null || true
      docker run -d --restart unless-stopped \
        --name dtrs-app-backend \
        --network dtrs-app-net \
        -p ${BACKEND_HOST_PORT}:4100 \
        --cpus=${BACKEND_CPUS} \
        --memory=${BACKEND_MEMORY} \
        --pids-limit ${BACKEND_PIDS_LIMIT} \
        --tmpfs /tmp:rw,noexec,nosuid \
        -e NODE_ENV=production \
        -e PORT=4100 \
        -e DATABASE_URL='${DATABASE_URL}' \
        -e JWT_SECRET='${JWT_SECRET}' \
        -e ALLOWED_ORIGINS='${ALLOWED_ORIGINS}' \
        -e FRONTEND_BASE_URL='${FRONTEND_BASE_URL}' \
        -e MINIO_ENDPOINT='${MINIO_ENDPOINT}' \
        -e MINIO_PORT='${MINIO_PORT}' \
        -e MINIO_ACCESS_KEY='${MINIO_ACCESS_KEY}' \
        -e MINIO_SECRET_KEY='${MINIO_SECRET_KEY}' \
        -e MINIO_BUCKET_NAME='${MINIO_BUCKET_NAME}' \
        -e MINIO_PUBLIC_URL='${MINIO_PUBLIC_URL}' \
        -e MINIO_SERVER_FETCH_BASE_URL='${MINIO_SERVER_FETCH_BASE_URL}' \
        -e SMTP_TLS_REJECT_UNAUTHORIZED='${SMTP_TLS_REJECT_UNAUTHORIZED}' \
        -e CRON_SECRET='${CRON_SECRET}' \
        '${BACKEND_IMAGE}'
      docker run -d --restart unless-stopped \
        --name dtrs-app-frontend \
        --network dtrs-app-net \
        -p ${FRONTEND_HOST_PORT}:3000 \
        --cpus=${FRONTEND_CPUS} \
        --memory=${FRONTEND_MEMORY} \
        --pids-limit ${FRONTEND_PIDS_LIMIT} \
        --tmpfs /tmp:rw,noexec,nosuid \
        -e NODE_ENV=production \
        -e NEXTAUTH_SECRET='${NEXTAUTH_SECRET}' \
        -e NEXTAUTH_URL='${NEXTAUTH_URL}' \
        -e API_INTERNAL_BASE_URL='${API_INTERNAL_BASE_URL}' \
        -e SENTRY_DSN='${SENTRY_DSN}' \
        -e SENTRY_URL='${SENTRY_URL}' \
        '${FRONTEND_IMAGE}'
      sleep 5
      for c in dtrs-app-backend dtrs-app-frontend; do
        running=\$(docker inspect -f '{{.State.Running}}' "\$c" 2>/dev/null || echo false)
        if [ "\$running" != "true" ]; then
          echo "ERROR: container \$c is not running after deploy"
          docker logs --tail 80 "\$c" || true
          exit 1
        fi
      done
      docker ps --filter name=dtrs-app-
      EOF

smoke:uat:docker:
  extends:
    - .smoke_deployed
    - .rules_staging
  needs:
    - job: deploy:uat:docker
  environment:
    name: staging
    url: $FRONTEND_BASE_URL

# --- DOCKER BUILD + DEPLOY: PRD (registry push/pull — no transfer) ---

docker_build:prd:
  stage: deploy_docker
  extends:
    - .runner_docker
    - .rules_prd
    - .docker_build_ci_runner
  environment:
    name: production
  needs:
    - job: build:frontend
    - job: build:backend
    - job: deploy:summary
  when: manual
  variables:
    IMAGE_BACKEND: "${APP_IMAGE_BACKEND}:${IMAGE_TAG}-prd"
    IMAGE_FRONTEND: "${APP_IMAGE_FRONTEND}:${IMAGE_TAG}-prd"
    TAG_BACKEND_LATEST: "${APP_IMAGE_BACKEND}:latest-prd"
    TAG_FRONTEND_LATEST: "${APP_IMAGE_FRONTEND}:latest-prd"

deploy:prd:docker:
  stage: deploy_docker
  extends:
    - .runner_docker
    - .deploy_ssh_and_validate
    - .rules_prd
  image: docker:latest
  variables:
    DEPLOY_SERVER: "$DEPLOY_SERVER_PRD"
    DEPLOY_PATH: "$DEPLOY_PATH_PRD"
    DOCKER_HOST_REMOTE: "$DOCKER_HOST_PRD"
    BACKEND_IMAGE: "${APP_IMAGE_BACKEND}:latest-prd"
    FRONTEND_IMAGE: "${APP_IMAGE_FRONTEND}:latest-prd"
  needs:
    - job: docker_build:prd
  when: manual
  environment:
    name: production
    url: $FRONTEND_BASE_URL
  script:
    # Pull from registry onto PRD daemon, retag short names, then compose via SSH
    - export DOCKER_HOST="$DOCKER_HOST_REMOTE"
    - . scripts/ci-registry.sh && registry_login && registry_pull_and_retag "$BACKEND_IMAGE" && registry_pull_and_retag "$FRONTEND_IMAGE"
    - ssh "$DEPLOY_SERVER" "mkdir -p '${DEPLOY_PATH}' && chmod 755 '${DEPLOY_PATH}'"
    - scp docker-compose.prod.yml "${DEPLOY_SERVER}:${DEPLOY_PATH}/docker-compose.prod.yml"
    - |
      ssh "$DEPLOY_SERVER" "bash -s" << EOF
      set -e
      export DOCKER_HOST='${DOCKER_HOST_REMOTE}'
      cd '${DEPLOY_PATH}'
      export BACKEND_IMAGE='${BACKEND_IMAGE}'
      export FRONTEND_IMAGE='${FRONTEND_IMAGE}'
      export BACKEND_HOST_PORT='${BACKEND_HOST_PORT}'
      export FRONTEND_HOST_PORT='${FRONTEND_HOST_PORT}'
      export BACKEND_CPUS='${BACKEND_CPUS}'
      export BACKEND_MEMORY='${BACKEND_MEMORY}'
      export BACKEND_PIDS_LIMIT='${BACKEND_PIDS_LIMIT}'
      export FRONTEND_CPUS='${FRONTEND_CPUS}'
      export FRONTEND_MEMORY='${FRONTEND_MEMORY}'
      export FRONTEND_PIDS_LIMIT='${FRONTEND_PIDS_LIMIT}'
      export DATABASE_URL='${DATABASE_URL}'
      export JWT_SECRET='${JWT_SECRET}'
      export ALLOWED_ORIGINS='${ALLOWED_ORIGINS}'
      export FRONTEND_BASE_URL='${FRONTEND_BASE_URL}'
      export MINIO_ENDPOINT='${MINIO_ENDPOINT}'
      export MINIO_PORT='${MINIO_PORT}'
      export MINIO_ACCESS_KEY='${MINIO_ACCESS_KEY}'
      export MINIO_SECRET_KEY='${MINIO_SECRET_KEY}'
      export MINIO_BUCKET_NAME='${MINIO_BUCKET_NAME}'
      export MINIO_PUBLIC_URL='${MINIO_PUBLIC_URL}'
      export MINIO_SERVER_FETCH_BASE_URL='${MINIO_SERVER_FETCH_BASE_URL}'
      export SMTP_TLS_REJECT_UNAUTHORIZED='${SMTP_TLS_REJECT_UNAUTHORIZED}'
      export CRON_SECRET='${CRON_SECRET}'
      export NEXTAUTH_SECRET='${NEXTAUTH_SECRET}'
      export NEXTAUTH_URL='${NEXTAUTH_URL}'
      export API_INTERNAL_BASE_URL='${API_INTERNAL_BASE_URL}'
      export SENTRY_DSN='${SENTRY_DSN}'
      export SENTRY_URL='${SENTRY_URL}'
      if docker compose version >/dev/null 2>&1; then
        dc() { docker compose -f docker-compose.prod.yml "\$@"; }
      elif command -v docker-compose >/dev/null 2>&1; then
        dc() { docker-compose -f docker-compose.prod.yml "\$@"; }
      else
        echo "ERROR: docker compose / docker-compose not found on PRD host"
        exit 1
      fi
      dc down --remove-orphans 2>/dev/null || true
      docker rm -f dtrs-app dtrs-app-backend dtrs-app-frontend 2>/dev/null || true
      dc up -d
      sleep 5
      for c in dtrs-app-backend dtrs-app-frontend; do
        running=\$(docker inspect -f '{{.State.Running}}' "\$c" 2>/dev/null || echo false)
        if [ "\$running" != "true" ]; then
          echo "ERROR: container \$c is not running after compose up"
          docker logs --tail 80 "\$c" || true
          dc ps || true
          exit 1
        fi
      done
      docker ps --filter name=dtrs-app-
      EOF

smoke:prd:docker:
  extends:
    - .smoke_deployed
    - .rules_prd
  needs:
    - job: deploy:prd:docker
  variables:
    SMOKE_BACKEND_URL: "${FRONTEND_BASE_URL}/api"
  environment:
    name: production
    url: $FRONTEND_BASE_URL

# --- CLEANUP ---
# Local Docker only (dtrs-app-*); no host-wide prune; no registry tag DELETE (ลบ legacy บน :5000 ด้วยมือ)

.cleanup_docker_images:
  extends: .ssh_setup
  stage: cleanup
  image: docker:latest
  when: manual
  allow_failure: true
  before_script:
    - !reference [.ssh_setup, before_script]
    - !reference [.validate_registry, before_script]
    - |
      missing=""
      [ -z "${CLEANUP_ENV:-}" ] && missing="$missing CLEANUP_ENV"
      [ -z "$DEPLOY_SERVER" ] && missing="$missing DEPLOY_SERVER(from DEPLOY_SERVER_UAT|PRD)"
      [ -z "$DOCKER_HOST_REMOTE" ] && missing="$missing DOCKER_HOST_REMOTE(from DOCKER_HOST_UAT|PRD)"
      if [ -n "$missing" ]; then
        echo "ERROR: Missing cleanup target GitLab CI/CD Variables:$missing"
        echo "See docs/GitLab-CI-Variables-Checklist.md กลุ่ม D"
        exit 1
      fi
  script:
    - sh scripts/ci-cleanup-remote.sh "$DEPLOY_SERVER" "$DOCKER_HOST_REMOTE"

cleanup:docker:uat:
  extends:
    - .runner_docker
    - .cleanup_docker_images
    - .rules_staging
  needs:
    - job: docker_build:uat
  variables:
    CLEANUP_ENV: "uat"
    DEPLOY_SERVER: "$DEPLOY_SERVER_UAT"
    DOCKER_HOST_REMOTE: "$DOCKER_HOST_UAT"
  environment:
    name: staging

cleanup:docker:prd:
  extends:
    - .runner_docker
    - .cleanup_docker_images
    - .rules_prd
  needs:
    - job: docker_build:prd
  variables:
    CLEANUP_ENV: "prd"
    # placeholder ให้ .cleanup_docker_images before_script ผ่าน (รอบ .128 ใช้ค่าจริงใน script)
    DEPLOY_SERVER: "$DEPLOY_SERVER_PRD"
    DOCKER_HOST_REMOTE: "$DOCKER_HOST_PRD"
  before_script:
    - !reference [.ssh_setup, before_script]
    - !reference [.validate_registry, before_script]
    - !reference [.validate_docker_host_build, before_script]
    - |
      missing=""
      [ -z "${CLEANUP_ENV:-}" ] && missing="$missing CLEANUP_ENV"
      [ -z "$DEPLOY_SERVER_PRD" ] && missing="$missing DEPLOY_SERVER_PRD"
      [ -z "$DOCKER_HOST_PRD" ] && missing="$missing DOCKER_HOST_PRD"
      if [ -n "$missing" ]; then
        echo "ERROR: Missing PRD cleanup hosts:$missing"
        echo "See docs/GitLab-CI-Variables-Checklist.md กลุ่ม D"
        exit 1
      fi
  script:
    # (1) build host .115 ผ่าน DOCKER_HOST_BUILD จาก runner (เหมือน docker_build:prd — ไม่พึ่ง DEPLOY_SERVER_UAT ใน scope production)
    - export DOCKER_HOST="$DOCKER_HOST_BUILD"
    - sh scripts/ci-cleanup-images.sh
    # (2) deploy host .128 ผ่าน SSH
    - sh scripts/ci-cleanup-remote.sh "$DEPLOY_SERVER_PRD" "$DOCKER_HOST_PRD"
  environment:
    name: production
