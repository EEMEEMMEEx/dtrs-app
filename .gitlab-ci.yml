# GitLab CI/CD — dtrs-app
# UAT: branch staging → http://192.168.0.115:8404 (manual deploy)
# PRD: branch main/master → https://dtrs-app.forth.co.th (manual deploy)
#
# GitLab CI/CD Variables (ใช้ environment scope staging / production ตาม job):
#   SSH_PRIVATE_KEY, DATABASE_URL, JWT_SECRET, NEXTAUTH_SECRET, NEXTAUTH_URL,
#   NEXT_PUBLIC_API_BASE_URL (build-arg frontend image), FRONTEND_BASE_URL,
#   ALLOWED_ORIGINS, MINIO_*, SMTP_TLS_REJECT_UNAUTHORIZED, CRON_SECRET
#   API_INTERNAL_BASE_URL — default ในไฟล์นี้ (NextAuth server-side → backend บน Docker network)
#   GlitchTip (optional): NEXT_PUBLIC_SENTRY_DSN (bake ตอน build:frontend), SENTRY_DSN + SENTRY_URL (runtime frontend)
#   NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE — bake ตอน build:frontend (optional override; ว่างใช้ fallback ตาม NEXT_PUBLIC_APP_ENV)
#   NEXT_PUBLIC_APP_ENV — default ตาม branch (staging/production) ใน .rules_ci_branches_with_env
#
# อ้างอิง: docs/GitLab-CI-Plan.md, docs/GitLab-CI-Variables-Checklist.md

workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^feat\/.*$/'
      when: never
    - when: always

stages:
  - test
  - build
  - deploy
  - deploy_docker
  - cleanup

variables:
  NODE_VERSION: "22.23.4"
  API_INTERNAL_BASE_URL: "http://dtrs-app-backend:4100/api"

  # Docker build server (EAS pattern)
  DOCKER_HOST_BUILD: "tcp://192.168.0.115:2375"
  DOCKER_HOST_PRD: "tcp://192.168.0.128:2375"
  DOCKER_HOST_UAT: "tcp://192.168.0.115:2375"

  APP_IMAGE_BACKEND: "dtrs-app-backend"
  APP_IMAGE_FRONTEND: "dtrs-app-frontend"
  IMAGE_TAG: "$CI_COMMIT_SHORT_SHA"

  DEPLOY_SERVER_UAT: "nurdin@192.168.0.115"
  DEPLOY_PATH_UAT: "/home/nurdin/dtrs-app"
  DEPLOY_SERVER_PRD: "nurdin@192.168.0.128"
  DEPLOY_PATH_PRD: "/home/nurdin/dtrs-app"

  FRONTEND_HOST_PORT: "8404"
  BACKEND_HOST_PORT: "8405"

  # Resource limits — sync กับ docker-compose.yml
  BACKEND_CPUS: "1.50"
  BACKEND_MEMORY: "1536m"
  BACKEND_PIDS_LIMIT: "512"
  FRONTEND_CPUS: "0.50"
  FRONTEND_MEMORY: "512m"
  FRONTEND_PIDS_LIMIT: "256"

  CLEANUP_KEEP_IMAGES: "2"

  # TC-CI-02 image size gate (MB) — ปรับได้เมื่อ optimize image ต่อ
  FRONTEND_IMAGE_MAX_MB: "500"
  BACKEND_IMAGE_MAX_MB: "1126"

# --- Reusable templates ---

.runner_docker:
  tags:
    - docker
    - forth

.ssh_setup:
  before_script:
    - apk add --no-cache openssh-client bash
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - |
      if [ -z "$SSH_PRIVATE_KEY" ]; then
        echo "ERROR: SSH_PRIVATE_KEY is not set (check GitLab CI/CD Variables + environment scope)"
        exit 1
      fi
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_ci
    - chmod 600 ~/.ssh/id_ci
    - |
      printf '%s\n' \
        'Host *' \
        '  IdentityFile ~/.ssh/id_ci' \
        '  IdentitiesOnly yes' \
        > ~/.ssh/config
      chmod 600 ~/.ssh/config
    - ssh-keyscan -H "${DEPLOY_SERVER#*@}" >> ~/.ssh/known_hosts 2>/dev/null || true

.validate_deploy_env:
  before_script:
    - |
      missing=""
      [ -z "$DATABASE_URL" ] && missing="$missing DATABASE_URL"
      [ -z "$JWT_SECRET" ] && missing="$missing JWT_SECRET"
      [ -z "$NEXTAUTH_SECRET" ] && missing="$missing NEXTAUTH_SECRET"
      [ -z "$NEXTAUTH_URL" ] && missing="$missing NEXTAUTH_URL"
      [ -z "$FRONTEND_BASE_URL" ] && missing="$missing FRONTEND_BASE_URL"
      [ -z "$ALLOWED_ORIGINS" ] && missing="$missing ALLOWED_ORIGINS"
      if [ -n "$missing" ]; then
        echo "ERROR: Missing required GitLab CI/CD Variables (check environment scope):$missing"
        echo "See docs/GitLab-CI-Variables-Checklist.md"
        exit 1
      fi

.deploy_ssh_and_validate:
  extends: .ssh_setup
  before_script:
    - !reference [.ssh_setup, before_script]
    - !reference [.validate_deploy_env, before_script]

.rules_ci_branches:
  rules:
    - if: '$CI_COMMIT_BRANCH == "staging" || $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master"'

# map branch → GitLab Environment name (ให้ variables ที่ scope เป็น staging/production ถูก inject)
.rules_ci_branches_with_env:
  rules:
    - if: '$CI_COMMIT_BRANCH == "staging"'
      variables:
        DTRS_CI_ENV: staging
        NEXT_PUBLIC_APP_ENV: staging
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master"'
      variables:
        DTRS_CI_ENV: production
        NEXT_PUBLIC_APP_ENV: production

.rules_staging:
  rules:
    - if: '$CI_COMMIT_BRANCH == "staging"'

.rules_prd:
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master"'

.docker_build_ci_runner:
  image: docker:latest
  script:
    - |
      if [ -z "$NEXT_PUBLIC_API_BASE_URL" ]; then
        echo "ERROR: NEXT_PUBLIC_API_BASE_URL is empty (required build-arg, check CI/CD Variables + scope)"
        exit 1
      fi
    - export DOCKER_HOST="$DOCKER_HOST_BUILD"
    - sh scripts/docker-artifact-gate.sh .
    # .dockerignore ปกติตัด node_modules/dist/.next — ต้องเปิดก่อน COPY ใน ci-runner
    - sh scripts/docker-ci-allow-artifacts.sh .
    - docker build --target ci-runner -t "$IMAGE_BACKEND" -f backend/Dockerfile ./backend
    - docker tag "$IMAGE_BACKEND" "$TAG_BACKEND_LATEST"
    - docker tag "$IMAGE_BACKEND" "$TAG_BACKEND_ALT"
    - |
      if [ -n "${TAG_BACKEND_EXTRA:-}" ]; then
        docker tag "$IMAGE_BACKEND" "$TAG_BACKEND_EXTRA"
      fi
    - sh scripts/docker-image-size-gate.sh "$IMAGE_BACKEND" "$BACKEND_IMAGE_MAX_MB" "backend"
    - docker build --target ci-runner -t "$IMAGE_FRONTEND" -f frontend/Dockerfile ./frontend
    - docker tag "$IMAGE_FRONTEND" "$TAG_FRONTEND_LATEST"
    - docker tag "$IMAGE_FRONTEND" "$TAG_FRONTEND_ALT"
    - |
      if [ -n "${TAG_FRONTEND_EXTRA:-}" ]; then
        docker tag "$IMAGE_FRONTEND" "$TAG_FRONTEND_EXTRA"
      fi
    - sh scripts/docker-image-size-gate.sh "$IMAGE_FRONTEND" "$FRONTEND_IMAGE_MAX_MB" "frontend"
    - docker images "${APP_IMAGE_BACKEND}"
    - docker images "${APP_IMAGE_FRONTEND}"

.smoke_deployed:
  stage: deploy_docker
  extends:
    - .runner_docker
  image: alpine:latest
  script:
    - apk add --no-cache curl bash
    - export SMOKE_FRONTEND_URL="${SMOKE_FRONTEND_URL:-$FRONTEND_BASE_URL}"
    - |
      if [ -z "$SMOKE_FRONTEND_URL" ]; then
        echo "ERROR: SMOKE_FRONTEND_URL / FRONTEND_BASE_URL is empty"
        exit 1
      fi
    - sh scripts/docker-regression-smoke.sh

# --- TEST ---

test:frontend:
  stage: test
  extends:
    - .runner_docker
    - .rules_ci_branches
  image: node:${NODE_VERSION}
  cache:
    key: ${CI_COMMIT_REF_SLUG}-frontend-test
    paths:
      - frontend/node_modules/
  script:
    - cd frontend
    - npm ci --prefer-offline --no-audit
    - npm run lint -- .

test:backend:
  stage: test
  extends:
    - .runner_docker
    - .rules_ci_branches
  image: node:${NODE_VERSION}
  cache:
    key: ${CI_COMMIT_REF_SLUG}-backend-test
    paths:
      - backend/node_modules/
  script:
    - cd backend
    - npm ci --prefer-offline --no-audit
    - npx prisma generate
    # CI: lint แบบอ่านอย่างเดียว (ห้าม --fix) — script npm run lint มี --fix ติดมา
    - npx eslint "{src,apps,libs,test}/**/*.ts"
    - npm test

# --- BUILD ---

build:frontend:
  stage: build
  extends:
    - .runner_docker
    - .rules_ci_branches_with_env
  image: node:${NODE_VERSION}
  # action: prepare — อ่าน env-scoped vars โดยไม่สร้าง deployment record
  environment:
    name: $DTRS_CI_ENV
    action: prepare
  needs:
    - job: test:frontend
  cache:
    key: ${CI_COMMIT_REF_SLUG}-frontend
    paths:
      - frontend/node_modules/
  script:
    - |
      if [ -z "$NEXT_PUBLIC_API_BASE_URL" ]; then
        echo "ERROR: NEXT_PUBLIC_API_BASE_URL is empty (required at next build, check CI/CD Variables + scope ${DTRS_CI_ENV})"
        exit 1
      fi
      if [ -n "$NEXT_PUBLIC_SENTRY_DSN" ]; then
        echo "GlitchTip: NEXT_PUBLIC_SENTRY_DSN is set (env=${NEXT_PUBLIC_APP_ENV:-unset})"
      else
        echo "GlitchTip: NEXT_PUBLIC_SENTRY_DSN is empty — browser error tracking disabled for this build"
      fi
      if [ -n "$NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE" ]; then
        echo "GlitchTip: NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE=${NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE} (baked)"
      else
        echo "GlitchTip: NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE empty — code fallback by NEXT_PUBLIC_APP_ENV=${NEXT_PUBLIC_APP_ENV:-unset}"
      fi
    - cd frontend
    - npm ci --prefer-offline --no-audit
    - npm run build
  artifacts:
    # ci-runner COPY แค่ standalone + static + public — อย่าส่งทั้ง `.next`
    # (`.next/cache` webpack มัก >500MB → GitLab coordinator 413)
    paths:
      - frontend/.next/standalone
      - frontend/.next/static
      - frontend/public
    expire_in: 1 hour

build:backend:
  stage: build
  extends:
    - .runner_docker
    - .rules_ci_branches
  image: node:${NODE_VERSION}
  needs:
    - job: test:backend
  cache:
    key: ${CI_COMMIT_REF_SLUG}-backend
    paths:
      - backend/node_modules/
  script:
    - cd backend
    - npm ci --prefer-offline --no-audit
    - npx prisma generate
    - npm run build
    - npm prune --omit=dev
  artifacts:
    paths:
      - backend/dist
      - backend/node_modules
      - backend/package.json
      - backend/package-lock.json
      - backend/prisma
    expire_in: 1 hour

# --- DEPLOY (summary) ---

deploy:summary:
  stage: deploy
  extends:
    - .runner_docker
    - .rules_ci_branches
  image: alpine:latest
  needs:
    - job: build:frontend
    - job: build:backend
  script:
    - |
      if [ "$CI_COMMIT_BRANCH" = "staging" ]; then
        echo "UAT: docker_build:uat (manual) → deploy:uat:docker (manual) → smoke:uat:docker (auto) บน ${DEPLOY_SERVER_UAT}"
      else
        echo "PRD: docker_build:prd (manual) → transfer:prd:images (manual) → deploy:prd:docker (manual) → smoke:prd:docker (auto) บน ${DEPLOY_SERVER_PRD}"
      fi

# --- DOCKER BUILD: UAT ---

docker_build:uat:
  stage: deploy_docker
  extends:
    - .runner_docker
    - .rules_staging
    - .docker_build_ci_runner
  environment:
    name: staging
  needs:
    - job: build:frontend
    - job: build:backend
    - job: deploy:summary
  when: manual
  variables:
    IMAGE_BACKEND: "${APP_IMAGE_BACKEND}:${IMAGE_TAG}-uat"
    IMAGE_FRONTEND: "${APP_IMAGE_FRONTEND}:${IMAGE_TAG}-uat"
    TAG_BACKEND_LATEST: "${APP_IMAGE_BACKEND}:uat-latest"
    TAG_BACKEND_ALT: "${APP_IMAGE_BACKEND}:latest-uat"
    TAG_FRONTEND_LATEST: "${APP_IMAGE_FRONTEND}:uat-latest"
    TAG_FRONTEND_ALT: "${APP_IMAGE_FRONTEND}:latest-uat"

deploy:uat:docker:
  stage: deploy_docker
  extends:
    - .runner_docker
    - .deploy_ssh_and_validate
    - .rules_staging
  image: alpine:latest
  variables:
    DEPLOY_SERVER: "$DEPLOY_SERVER_UAT"
    DEPLOY_PATH: "$DEPLOY_PATH_UAT"
    DOCKER_HOST_REMOTE: "$DOCKER_HOST_UAT"
    BACKEND_IMAGE: "${APP_IMAGE_BACKEND}:uat-latest"
    FRONTEND_IMAGE: "${APP_IMAGE_FRONTEND}:uat-latest"
  needs:
    - job: docker_build:uat
  when: manual
  environment:
    name: staging
    url: $FRONTEND_BASE_URL
  script:
    - |
      ssh "$DEPLOY_SERVER" "bash -s" << EOF
      set -e
      export DOCKER_HOST='${DOCKER_HOST_REMOTE}'
      mkdir -p '${DEPLOY_PATH}'
      cd '${DEPLOY_PATH}'
      docker network inspect dtrs-app-net >/dev/null 2>&1 || docker network create dtrs-app-net
      docker rm -f dtrs-app dtrs-app-backend dtrs-app-frontend 2>/dev/null || true
      docker run -d --restart unless-stopped \
        --name dtrs-app-backend \
        --network dtrs-app-net \
        -p ${BACKEND_HOST_PORT}:4100 \
        --cpus=${BACKEND_CPUS} \
        --memory=${BACKEND_MEMORY} \
        --pids-limit ${BACKEND_PIDS_LIMIT} \
        --tmpfs /tmp:rw,noexec,nosuid \
        -e NODE_ENV=production \
        -e PORT=4100 \
        -e DATABASE_URL='${DATABASE_URL}' \
        -e JWT_SECRET='${JWT_SECRET}' \
        -e ALLOWED_ORIGINS='${ALLOWED_ORIGINS}' \
        -e FRONTEND_BASE_URL='${FRONTEND_BASE_URL}' \
        -e MINIO_ENDPOINT='${MINIO_ENDPOINT}' \
        -e MINIO_PORT='${MINIO_PORT}' \
        -e MINIO_ACCESS_KEY='${MINIO_ACCESS_KEY}' \
        -e MINIO_SECRET_KEY='${MINIO_SECRET_KEY}' \
        -e MINIO_BUCKET_NAME='${MINIO_BUCKET_NAME}' \
        -e MINIO_PUBLIC_URL='${MINIO_PUBLIC_URL}' \
        -e MINIO_SERVER_FETCH_BASE_URL='${MINIO_SERVER_FETCH_BASE_URL}' \
        -e SMTP_TLS_REJECT_UNAUTHORIZED='${SMTP_TLS_REJECT_UNAUTHORIZED}' \
        -e CRON_SECRET='${CRON_SECRET}' \
        '${BACKEND_IMAGE}'
      docker run -d --restart unless-stopped \
        --name dtrs-app-frontend \
        --network dtrs-app-net \
        -p ${FRONTEND_HOST_PORT}:3000 \
        --cpus=${FRONTEND_CPUS} \
        --memory=${FRONTEND_MEMORY} \
        --pids-limit ${FRONTEND_PIDS_LIMIT} \
        --tmpfs /tmp:rw,noexec,nosuid \
        -e NODE_ENV=production \
        -e NEXTAUTH_SECRET='${NEXTAUTH_SECRET}' \
        -e NEXTAUTH_URL='${NEXTAUTH_URL}' \
        -e API_INTERNAL_BASE_URL='${API_INTERNAL_BASE_URL}' \
        -e SENTRY_DSN='${SENTRY_DSN}' \
        -e SENTRY_URL='${SENTRY_URL}' \
        '${FRONTEND_IMAGE}'
      sleep 5
      for c in dtrs-app-backend dtrs-app-frontend; do
        running=\$(docker inspect -f '{{.State.Running}}' "\$c" 2>/dev/null || echo false)
        if [ "\$running" != "true" ]; then
          echo "ERROR: container \$c is not running after deploy"
          docker logs --tail 80 "\$c" || true
          exit 1
        fi
      done
      docker ps --filter name=dtrs-app-
      EOF

smoke:uat:docker:
  extends:
    - .smoke_deployed
    - .rules_staging
  needs:
    - job: deploy:uat:docker
  environment:
    name: staging
    url: $FRONTEND_BASE_URL

# --- DOCKER BUILD + TRANSFER: PRD ---

docker_build:prd:
  stage: deploy_docker
  extends:
    - .runner_docker
    - .rules_prd
    - .docker_build_ci_runner
  environment:
    name: production
  needs:
    - job: build:frontend
    - job: build:backend
    - job: deploy:summary
  when: manual
  variables:
    IMAGE_BACKEND: "${APP_IMAGE_BACKEND}:${IMAGE_TAG}-prd"
    IMAGE_FRONTEND: "${APP_IMAGE_FRONTEND}:${IMAGE_TAG}-prd"
    TAG_BACKEND_LATEST: "${APP_IMAGE_BACKEND}:latest-prd"
    TAG_BACKEND_ALT: "${APP_IMAGE_BACKEND}:prd-latest"
    TAG_BACKEND_EXTRA: "${APP_IMAGE_BACKEND}:prd"
    TAG_FRONTEND_LATEST: "${APP_IMAGE_FRONTEND}:latest-prd"
    TAG_FRONTEND_ALT: "${APP_IMAGE_FRONTEND}:prd-latest"
    TAG_FRONTEND_EXTRA: "${APP_IMAGE_FRONTEND}:prd"

transfer:prd:images:
  stage: deploy_docker
  extends:
    - .runner_docker
    - .ssh_setup
    - .rules_prd
  image: docker:latest
  variables:
    DEPLOY_SERVER: "$DEPLOY_SERVER_PRD"
    DEPLOY_PATH: "$DEPLOY_PATH_PRD"
    DOCKER_HOST_REMOTE: "$DOCKER_HOST_PRD"
  needs:
    - job: docker_build:prd
  when: manual
  environment:
    name: production
  script:
    - export DOCKER_HOST="$DOCKER_HOST_BUILD"
    - ssh "$DEPLOY_SERVER" "mkdir -p '${DEPLOY_PATH}' && chmod 755 '${DEPLOY_PATH}'"
    - |
      transfer_image() {
        local IMAGE="$1"
        local TAR_NAME
        TAR_NAME="$(echo "$IMAGE" | tr '/:' '_').tar"
        local TAR_PATH="/tmp/${TAR_NAME}"
        echo "=== Saving ${IMAGE} from build server (${DOCKER_HOST}) ==="
        docker save "$IMAGE" -o "$TAR_PATH"
        echo "=== Copying to ${DEPLOY_SERVER}:${DEPLOY_PATH}/ ==="
        scp "$TAR_PATH" "${DEPLOY_SERVER}:${DEPLOY_PATH}/"
        echo "=== Loading on PRD server (DOCKER_HOST=${DOCKER_HOST_REMOTE}) ==="
        ssh "$DEPLOY_SERVER" "DOCKER_HOST='${DOCKER_HOST_REMOTE}' docker load -i '${DEPLOY_PATH}/${TAR_NAME}' && rm -f '${DEPLOY_PATH}/${TAR_NAME}'"
        rm -f "$TAR_PATH"
      }
      transfer_image "${APP_IMAGE_BACKEND}:latest-prd"
      transfer_image "${APP_IMAGE_FRONTEND}:latest-prd"
      transfer_image "${APP_IMAGE_BACKEND}:${IMAGE_TAG}-prd"
      transfer_image "${APP_IMAGE_FRONTEND}:${IMAGE_TAG}-prd"
    - |
      ssh "$DEPLOY_SERVER" "bash -s" << EOF
      set -e
      export DOCKER_HOST='${DOCKER_HOST_REMOTE}'
      docker images '${APP_IMAGE_BACKEND}'
      docker images '${APP_IMAGE_FRONTEND}'
      EOF

deploy:prd:docker:
  stage: deploy_docker
  extends:
    - .runner_docker
    - .deploy_ssh_and_validate
    - .rules_prd
  image: alpine:latest
  variables:
    DEPLOY_SERVER: "$DEPLOY_SERVER_PRD"
    DEPLOY_PATH: "$DEPLOY_PATH_PRD"
    DOCKER_HOST_REMOTE: "$DOCKER_HOST_PRD"
    BACKEND_IMAGE: "${APP_IMAGE_BACKEND}:latest-prd"
    FRONTEND_IMAGE: "${APP_IMAGE_FRONTEND}:latest-prd"
  needs:
    - job: transfer:prd:images
  when: manual
  environment:
    name: production
    url: $FRONTEND_BASE_URL
  script:
    - |
      ssh "$DEPLOY_SERVER" "bash -s" << EOF
      set -e
      export DOCKER_HOST='${DOCKER_HOST_REMOTE}'
      mkdir -p '${DEPLOY_PATH}'
      cd '${DEPLOY_PATH}'
      docker network inspect dtrs-app-net >/dev/null 2>&1 || docker network create dtrs-app-net
      docker rm -f dtrs-app dtrs-app-backend dtrs-app-frontend 2>/dev/null || true
      docker run -d --restart unless-stopped \
        --name dtrs-app-backend \
        --network dtrs-app-net \
        -p ${BACKEND_HOST_PORT}:4100 \
        --cpus=${BACKEND_CPUS} \
        --memory=${BACKEND_MEMORY} \
        --pids-limit ${BACKEND_PIDS_LIMIT} \
        --tmpfs /tmp:rw,noexec,nosuid \
        -e NODE_ENV=production \
        -e PORT=4100 \
        -e DATABASE_URL='${DATABASE_URL}' \
        -e JWT_SECRET='${JWT_SECRET}' \
        -e ALLOWED_ORIGINS='${ALLOWED_ORIGINS}' \
        -e FRONTEND_BASE_URL='${FRONTEND_BASE_URL}' \
        -e MINIO_ENDPOINT='${MINIO_ENDPOINT}' \
        -e MINIO_PORT='${MINIO_PORT}' \
        -e MINIO_ACCESS_KEY='${MINIO_ACCESS_KEY}' \
        -e MINIO_SECRET_KEY='${MINIO_SECRET_KEY}' \
        -e MINIO_BUCKET_NAME='${MINIO_BUCKET_NAME}' \
        -e MINIO_PUBLIC_URL='${MINIO_PUBLIC_URL}' \
        -e MINIO_SERVER_FETCH_BASE_URL='${MINIO_SERVER_FETCH_BASE_URL}' \
        -e SMTP_TLS_REJECT_UNAUTHORIZED='${SMTP_TLS_REJECT_UNAUTHORIZED}' \
        -e CRON_SECRET='${CRON_SECRET}' \
        '${BACKEND_IMAGE}'
      docker run -d --restart unless-stopped \
        --name dtrs-app-frontend \
        --network dtrs-app-net \
        -p ${FRONTEND_HOST_PORT}:3000 \
        --cpus=${FRONTEND_CPUS} \
        --memory=${FRONTEND_MEMORY} \
        --pids-limit ${FRONTEND_PIDS_LIMIT} \
        --tmpfs /tmp:rw,noexec,nosuid \
        -e NODE_ENV=production \
        -e NEXTAUTH_SECRET='${NEXTAUTH_SECRET}' \
        -e NEXTAUTH_URL='${NEXTAUTH_URL}' \
        -e API_INTERNAL_BASE_URL='${API_INTERNAL_BASE_URL}' \
        -e SENTRY_DSN='${SENTRY_DSN}' \
        -e SENTRY_URL='${SENTRY_URL}' \
        '${FRONTEND_IMAGE}'
      sleep 5
      for c in dtrs-app-backend dtrs-app-frontend; do
        running=\$(docker inspect -f '{{.State.Running}}' "\$c" 2>/dev/null || echo false)
        if [ "\$running" != "true" ]; then
          echo "ERROR: container \$c is not running after deploy"
          docker logs --tail 80 "\$c" || true
          exit 1
        fi
      done
      docker ps --filter name=dtrs-app-
      EOF

smoke:prd:docker:
  extends:
    - .smoke_deployed
    - .rules_prd
  needs:
    - job: deploy:prd:docker
  variables:
    SMOKE_BACKEND_URL: "${FRONTEND_BASE_URL}/api"
  environment:
    name: production
    url: $FRONTEND_BASE_URL

# --- CLEANUP ---

.cleanup_docker_images:
  extends: .ssh_setup
  stage: cleanup
  image: docker:latest
  when: manual
  allow_failure: true
  script:
    - |
      ssh "$DEPLOY_SERVER" "DOCKER_HOST='${DOCKER_HOST_REMOTE}' bash -s" << EOF
      set -e
      export DOCKER_HOST='${DOCKER_HOST_REMOTE}'
      echo "Before cleanup:"
      docker system df || true
      docker image prune -f || true
      KEEP=${CLEANUP_KEEP_IMAGES}
      for APP_IMAGE in ${APP_IMAGE_BACKEND} ${APP_IMAGE_FRONTEND}; do
        OLD=\$(docker images "\$APP_IMAGE" --format "{{.ID}} {{.CreatedAt}}" | sort -k2 -r | tail -n +\$((KEEP+1)) | awk '{print \$1}' | sort -u)
        if [ -n "\$OLD" ]; then
          echo "Removing old images for \$APP_IMAGE:"
          echo "\$OLD" | xargs -r docker rmi -f || true
        else
          echo "No old images to remove for \$APP_IMAGE"
        fi
      done
      echo "After cleanup:"
      docker system df || true
      EOF

cleanup:docker:uat:
  extends:
    - .runner_docker
    - .cleanup_docker_images
    - .rules_staging
  needs:
    - job: docker_build:uat
  variables:
    DEPLOY_SERVER: "$DEPLOY_SERVER_UAT"
    DOCKER_HOST_REMOTE: "$DOCKER_HOST_UAT"
  environment:
    name: staging

cleanup:docker:prd:
  extends:
    - .runner_docker
    - .cleanup_docker_images
    - .rules_prd
  needs:
    - job: transfer:prd:images
  variables:
    DEPLOY_SERVER: "$DEPLOY_SERVER_PRD"
    DOCKER_HOST_REMOTE: "$DOCKER_HOST_PRD"
  environment:
    name: production
